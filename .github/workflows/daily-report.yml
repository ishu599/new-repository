name: Daily Github Health Report

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:
jobs:
  generate-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: action/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrae pip
          pip install -r requirments.txt

      - name: Generate report
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/main.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add reports/github-health-report.md

          git diff --stages --quiet || git commit -m "Update Github health report"

          git push